<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurriculoGen - Swiss Editorial</title>
  <style>
    :root {
      --primary-dark: #111827;
      --accent-steel: #4b5563;
      --text-main: #111827;
      --text-muted: #6b7280;
      --line-color: #d1d5db;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      background: #ffffff;
      line-height: 1.45;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 16mm 18mm;
      background: #ffffff;
    }

    @media print {
      @page { size: A4; margin: 0; }
      .page { width: 100%; min-height: 100%; margin: 0; }
    }

    header {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--primary-dark);
      margin-bottom: 18px;
      align-items: end;
    }

    h1#nome {
      font-size: 25pt;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--primary-dark);
      line-height: 1.05;
    }

    #cargo {
      font-size: 11pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-steel);
      margin-top: 6px;
    }

    .contact-stack {
      text-align: right;
      font-size: 8.5pt;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .swiss-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-color);
    }

    .swiss-row:last-child {
      border-bottom: none;
    }

    .swiss-label {
      font-size: 8.5pt;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--primary-dark);
      padding-top: 2px;
    }

    .swiss-content p#resumo {
      font-size: 9.5pt;
      text-align: justify;
    }

    #hard-skills-lista {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 16px;
    }

    #soft-skills-lista, #idiomas-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1 id="nome">NOME DO CANDIDATO</h1>
        <div id="cargo">TÍTULO PROFISSIONAL</div>
      </div>
      <div class="contact-stack">
        <span id="email">E-mail</span>
        <span id="tel">Telefone</span>
        <span id="local">Cidade, UF</span>
        <span id="linkedin">LinkedIn</span>
        <span id="nascimento">Nascimento</span>
      </div>
    </header>

    <section id="section-resumo" class="swiss-row">
      <div class="swiss-label">Perfil</div>
      <div class="swiss-content"><p id="resumo"></p></div>
    </section>

    <section id="section-experiencia" class="swiss-row">
      <div class="swiss-label">Experiência</div>
      <div class="swiss-content" id="experiencias"></div>
    </section>

    <section id="section-formacao" class="swiss-row">
      <div class="swiss-label">Formação</div>
      <div class="swiss-content" id="formacao"></div>
    </section>

    <section id="section-projetos" class="swiss-row">
      <div class="swiss-label">Projetos</div>
      <div class="swiss-content" id="projetos-lista"></div>
    </section>

    <section id="section-hard-skills" class="swiss-row">
      <div class="swiss-label">Competências</div>
      <div class="swiss-content"><div id="hard-skills-lista"></div></div>
    </section>

    <section id="section-soft-skills" class="swiss-row">
      <div class="swiss-label">Soft Skills</div>
      <div class="swiss-content"><div id="soft-skills-lista"></div></div>
    </section>

    <section id="section-idiomas" class="swiss-row">
      <div class="swiss-label">Idiomas</div>
      <div class="swiss-content"><div id="idiomas-lista"></div></div>
    </section>

    <section id="section-cursos" class="swiss-row">
      <div class="swiss-label">Certificações</div>
      <div class="swiss-content"><ul id="cursos-lista"></ul></div>
    </section>
  </div>
</body>
</html>
