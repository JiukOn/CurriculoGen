<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurriculoGen - Retro Pixel</title>
  <style>
    :root {
      --primary-dark: #1f2937;
      --accent-steel: #10b981;
      --text-main: #111827;
      --pixel-bg: #f8fafc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Silkscreen', monospace;
      color: var(--text-main);
      background: #ffffff;
      line-height: 1.45;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm 14mm;
      background: #ffffff;
    }

    @media print {
      @page { size: A4; margin: 0; }
      .page { width: 100%; min-height: 100%; margin: 0; }
    }

    .pixel-frame {
      border: 3px solid var(--primary-dark);
      box-shadow: 5px 5px 0 var(--accent-steel);
      padding: 14px 16px;
      margin-bottom: 16px;
      background: var(--pixel-bg);
    }

    h1#nome {
      font-size: 20pt;
      color: var(--primary-dark);
      letter-spacing: 0.5px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    #cargo {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      background: var(--primary-dark);
      color: #ffffff;
      font-size: 9.5pt;
      box-shadow: 3px 3px 0 var(--accent-steel);
    }

    .pixel-contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 12px;
      font-size: 8pt;
      color: var(--primary-dark);
    }

    .pixel-section {
      margin-bottom: 14px;
      border: 2px solid var(--primary-dark);
      padding: 10px 14px;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.12);
      background: #ffffff;
    }

    .pixel-sec-header {
      display: inline-block;
      background: var(--accent-steel);
      color: #ffffff;
      padding: 3px 10px;
      font-size: 9pt;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
      box-shadow: 3px 3px 0 var(--primary-dark);
    }

    p#resumo {
      font-size: 9pt;
      text-align: justify;
    }

    .pixel-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    #soft-skills-lista, #idiomas-lista {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="pixel-frame">
      <h1 id="nome">NOME DO CANDIDATO</h1>
      <div id="cargo">PLAYER 1 // CARGO</div>
      <div class="pixel-contacts">
        <span id="local">Cidade, UF</span>
        <span id="tel">Telefone</span>
        <span id="email">E-mail</span>
        <span id="linkedin">LinkedIn</span>
        <span id="nascimento">Nascimento</span>
      </div>
    </header>

    <section id="section-resumo" class="pixel-section">
      <div class="pixel-sec-header">STATUS / RESUMO</div>
      <p id="resumo"></p>
    </section>

    <section id="section-experiencia" class="pixel-section">
      <div class="pixel-sec-header">QUESTS / EXPERIÊNCIA</div>
      <div id="experiencias"></div>
    </section>

    <section id="section-projetos" class="pixel-section">
      <div class="pixel-sec-header">PROJETOS</div>
      <div id="projetos-lista"></div>
    </section>

    <section id="section-formacao" class="pixel-section">
      <div class="pixel-sec-header">FORMAÇÃO ACADÊMICA</div>
      <div id="formacao"></div>
    </section>

    <div class="pixel-grid-2">
      <section id="section-hard-skills" class="pixel-section">
        <div class="pixel-sec-header">SKILL TREE</div>
        <div id="hard-skills-lista"></div>
      </section>

      <section id="section-soft-skills" class="pixel-section">
        <div class="pixel-sec-header">ATRIBUTOS</div>
        <div id="soft-skills-lista"></div>
      </section>
    </div>

    <div class="pixel-grid-2">
      <section id="section-idiomas" class="pixel-section">
        <div class="pixel-sec-header">IDIOMAS</div>
        <div id="idiomas-lista"></div>
      </section>

      <section id="section-cursos" class="pixel-section">
        <div class="pixel-sec-header">CONQUISTAS / CURSOS</div>
        <ul id="cursos-lista"></ul>
      </section>
    </div>
  </div>
</body>
</html>
